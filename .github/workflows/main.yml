name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Projeyi kur
        run: npm install

      - name: Capacitor paketlerini kur
        run: npm install @capacitor/core@7.6.9 @capacitor/cli@7.6.9 @capacitor/android@7.6.9 @capacitor/app@7.0.2 @capacitor/share@latest-7 @capacitor/filesystem@7.1.8 @capacitor/assets@3.0.5 @byteowls/capacitor-filesharer@7.0.0

      - name: Web uygulamasını oluştur
        run: npm run build:dev

      - name: Android projesini oluştur
        run: |
          npx cap init "BIM Ziyaret" "com.evren.bimziyaret" --web-dir .vercel/output/static
          npx cap add android
          npx cap sync android
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/java/com/evren/bimziyaret/MainActivity.java"); s=p.read_text(); s=s.replace("public class MainActivity extends BridgeActivity {","public class MainActivity extends BridgeActivity {\n  @Override\n  public void onSaveInstanceState(android.os.Bundle outState) {\n    super.onSaveInstanceState(outState);\n    outState.clear();\n  }"); p.write_text(s)'
      - name: Uygulama ikonunu oluştur
        run: |
          mkdir -p assets
          cp V16-BIM-Ziyaret-icon.png assets/icon-only.png
          npx capacitor-assets generate --android

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: BIM-Ziyaret-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
